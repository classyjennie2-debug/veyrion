<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>project_3049 — Download Complete</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    color: #111827;
  }
  .card {
    background: #ffffff;
    padding: 40px 48px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 460px;
    width: 100%;
  }
  .check {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #dcfce7;
    color: #166534;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    margin: 0 auto 16px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #111827; }
  p { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
  .project { font-weight: 600; color: #2563eb; }
  a {
    display: inline-block;
    background: #2563eb;
    color: #ffffff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
  }
  a:hover { background: #1d4ed8; }
  .hint { margin-top: 16px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>

<div class="card">
  <div class="check">&#10004;</div>
  <h1>project_3049 downloaded successfully</h1>
  <p>The <span class="project">project_3049</span> zip file has been downloaded automatically to your device.</p>
  <a id="manualLink" href="/project_3049/project_3049.zip" download>Click here to download manually</a>
  <div class="hint">If the download did not start, use the link above to get project_3049.zip.</div>
</div>

<script>
(function() {
  var fileName = 'project_3049.zip';
  var fileUrl = '/project_3049/project_3049.zip';

  function triggerDownload(url, name) {
    var link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  window.addEventListener('load', function() {
    triggerDownload(fileUrl, fileName);
  });
})();
</script>

</body>
</html>
